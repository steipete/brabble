version: 2

project_name: brabble

builds:
  - id: brabble
    main: ./cmd/brabble
    binary: brabble
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I/usr/local/opt/whisper/include -mmacosx-version-min=14.0
      - CGO_LDFLAGS=-L/usr/local/opt/whisper/lib -mmacosx-version-min=14.0 -Wl,-rpath,@executable_path/lib
    goos:
      - darwin
    goarch:
      - arm64
    hooks:
      post:
        - cmd: >-
            bash -o pipefail -c 'for binary in "{{ .Path }}" .release-libs/*.dylib; do
            echo "Checking macOS minimum: $binary";
            xcrun vtool -show-build "$binary" |
            awk '\''$1 == "cmd" { legacy=($2 == "LC_VERSION_MIN_MACOSX") } $1 == "minos" || (legacy && $1 == "version") { found=1; split($2, v, "."); print $0; if (v[1] > 14 || (v[1] == 14 && (v[2] > 0 || v[3] > 0))) bad=1 } END { exit (!found || bad) }'\'' || exit 1;
            done'

archives:
  - ids:
      - brabble
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
      - src: README.md
      - src: CHANGELOG.md
      - src: .release-libs/*.dylib
        dst: lib

notarize:
  macos:
    - enabled: true
      ids:
        - brabble
      sign:
        certificate: "env:MACOS_SIGNING_P12"
        password: "{{ .Env.MACOS_SIGNING_P12_PASSWORD }}"
        entitlements: .github/macos-entitlements.plist
      notarize:
        issuer_id: "{{ .Env.ASC_ISSUER_ID }}"
        key_id: "{{ .Env.ASC_KEY_ID }}"
        key: "{{ .Env.NOTARY_KEY_FILE }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt
