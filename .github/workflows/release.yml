name: release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify archives without signing or publishing"
        type: boolean
        default: true
      tag:
        description: "Tag to (re)release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: xcode-27
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      PUBLISH_RELEASE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stash GoReleaser config
        run: cp .goreleaser.yaml /tmp/.goreleaser.yaml

      - name: Checkout release tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: git checkout "$RELEASE_TAG"

      - name: Prepare signing and notarization
        if: env.PUBLISH_RELEASE == 'true'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          test -n "$MACOS_SIGNING_P12"
          test -n "$MACOS_SIGNING_P12_PASSWORD"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_P8"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY_P8" > "$RUNNER_TEMP/brabble-notary.p8"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/brabble-notary.p8" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install build deps
        run: |
          brew install cmake portaudio

      - name: Build whisper.cpp (headers + dylibs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          binding_version="$(go list -m -f '{{.Version}}' github.com/ggerganov/whisper.cpp/bindings/go)"
          binding_ref="${binding_version##*-}"
          if [[ -f WHISPER_CPP_REF ]]; then
            whisper_cpp_ref="$(tr -d '\n' < WHISPER_CPP_REF)"
            test "$binding_ref" = "${whisper_cpp_ref:0:12}"
          else
            whisper_cpp_ref="$(gh api "repos/ggml-org/whisper.cpp/commits/$binding_ref" --jq .sha)"
          fi
          git init /tmp/whisper.cpp-build
          git -C /tmp/whisper.cpp-build remote add origin https://github.com/ggml-org/whisper.cpp.git
          git -C /tmp/whisper.cpp-build fetch --depth 1 origin "$whisper_cpp_ref"
          git -C /tmp/whisper.cpp-build checkout --detach FETCH_HEAD
          cmake -S /tmp/whisper.cpp-build -B /tmp/whisper.cpp-build/build \
            -DGGML_METAL=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DGGML_BLAS=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_TESTS=OFF
          cmake --build /tmp/whisper.cpp-build/build --parallel
          sudo cmake --install /tmp/whisper.cpp-build/build --prefix /usr/local/opt/whisper

      - name: Stage whisper.cpp runtime libraries
        run: |
          mkdir -p .release-libs
          cp -a /usr/local/opt/whisper/lib/libwhisper*.dylib .release-libs/
          cp -a /usr/local/opt/whisper/lib/libggml*.dylib .release-libs/

      - name: Test
        run: make WHISPER_PREFIX=/usr/local/opt/whisper test

      - name: Sign and notarize runtime libraries
        if: env.PUBLISH_RELEASE == 'true'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          umask 077
          signing_keychain="$RUNNER_TEMP/brabble-runtime-signing.keychain-db"
          signing_p12="$RUNNER_TEMP/brabble-runtime-signing.p12"
          signing_password="$(openssl rand -hex 24)"
          prior_keychains=()
          while IFS= read -r path; do
            prior_keychains+=("$path")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')
          cleanup() {
            security list-keychains -d user -s "${prior_keychains[@]}"
            security delete-keychain "$signing_keychain"
            rm -f "$signing_p12"
          }
          trap cleanup EXIT
          printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$signing_p12"
          security create-keychain -p "$signing_password" "$signing_keychain"
          security unlock-keychain -p "$signing_password" "$signing_keychain"
          security list-keychains -d user -s "$signing_keychain" "${prior_keychains[@]}"
          security import "$signing_p12" -k "$signing_keychain" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$signing_password" "$signing_keychain" >/dev/null
          while IFS= read -r -d '' library; do
            codesign --force --timestamp --keychain "$signing_keychain" \
              --sign "Developer ID Application: Peter Steinberger (Y5PE65HELJ)" "$library"
            codesign --verify --strict "$library"
          done < <(find .release-libs -type f -name '*.dylib' -print0)
          ditto -c -k --keepParent .release-libs "$RUNNER_TEMP/brabble-runtime-libs.zip"
          xcrun notarytool submit "$RUNNER_TEMP/brabble-runtime-libs.zip" \
            --key "$NOTARY_KEY_FILE" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 20m --output-format json > "$RUNNER_TEMP/brabble-runtime-notary.json"
          python3 - "$RUNNER_TEMP/brabble-runtime-notary.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print(json.dumps(result))
          assert result["status"] == "Accepted", "runtime library notarization failed"
          PY

      - name: Prepare release notes
        if: env.PUBLISH_RELEASE == 'true'
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v prefix="## [$version]" '
            index($0, prefix) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: GoReleaser
        if: env.PUBLISH_RELEASE == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --config /tmp/.goreleaser.yaml --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Build dry-run archives
        if: env.PUBLISH_RELEASE != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --snapshot --skip=sign,notarize --config /tmp/.goreleaser.yaml

      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/brabble-notary.p8"
